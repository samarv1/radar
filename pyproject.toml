[project]
name = "radar"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "psycopg2-binary>=2.9.12",
    "python-dotenv>=1.2.2",
    "rapidfuzz>=3.14.5",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "ruff>=0.16.3",
]

[tool.ruff]
exclude = [".venv"]

[tool.ruff.lint]
# Keep this conservative: catch real bugs (unused imports, undefined names,
# syntax-level issues), not a full style/best-practices ruleset.
select = ["E4", "E7", "E9", "F"]
